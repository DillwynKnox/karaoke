[project]
name = "karaoke"
version = "0.1.0"
description = "Party karaoke: vocal separation, synced lyrics and a song queue for hub, player screen and guests"
readme = "README.md"
requires-python = "==3.13.*"
# The base install is all the player and guest node need: no torch, no demucs, no ffmpeg.
dependencies = [
    "flask>=3.1",
    "itsdangerous>=2.2",
    "python-dotenv>=1.2",
    "requests>=2.32",
    "segno>=1.6",
]

[project.optional-dependencies]
# Audio stack of the hub. Pick it through one of the torch variants below.
hub = [
    "demucs @ git+https://github.com/adefossez/demucs.git@eeac1d15891af95b1288d2884b95baa3e5baa96c",
    "essentia==2.1b6.dev1389",
    "huggingface-hub>=1.24",
    "librosa>=0.11",
    # essentia is built against numpy 1.x
    "numpy<2",
    "pyphen>=0.18",
    "transformers>=5.17",
    "uroman>=1.3",
    "yt-dlp>=2026.8.19",
]
cpu = ["karaoke[hub]", "torch==2.13.0"]
# triton-rocm only exists on the PyTorch index, so it is named here to pull it from there.
rocm = ["karaoke[hub]", "torch==2.13.0", "triton-rocm; sys_platform == 'linux'"]
cuda = ["karaoke[hub]", "torch==2.13.0"]

[project.scripts]
karaoke = "karaoke.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv]
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin' and platform_machine == 'arm64'"]
conflicts = [[{ extra = "cpu" }, { extra = "rocm" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-rocm", extra = "rocm" },
    { index = "pytorch-cuda", extra = "cuda" },
]
triton-rocm = [{ index = "pytorch-rocm", extra = "rocm" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]  # zip() over pairwise neighbours is intentionally non-strict

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
